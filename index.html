<title>欧冠推演室</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&family=Noto+Sans+SC:wght@400;500;700;900&display=swap">
<style>
:root{
  --bg:#F2F4EF; --surface:#FFFFFF; --surface2:#E8ECE5; --ink:#14201A; --muted:#5A6760; --line:#D7DED6;
  --accent:#1E6B47; --accent-ink:#FFFFFF; --gold:#A86F14;
  --win:#2E8456; --draw:#8C968F; --loss:#BE4A3B; --heat:30,107,71;
  --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a; --s4:#eda100;
  --num:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --sans:"Barlow","Noto Sans SC","PingFang SC","Microsoft YaHei",system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#0D1311; --surface:#141C19; --surface2:#1B2622; --ink:#E4EBE6; --muted:#93A39A; --line:#26332E;
    --accent:#4FBF86; --accent-ink:#0B1410; --gold:#E2AA4C;
    --win:#3FA772; --draw:#6F7C75; --loss:#D5604F; --heat:79,191,134;
    --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0D1311; --surface:#141C19; --surface2:#1B2622; --ink:#E4EBE6; --muted:#93A39A; --line:#26332E;
  --accent:#4FBF86; --accent-ink:#0B1410; --gold:#E2AA4C;
  --win:#3FA772; --draw:#6F7C75; --loss:#D5604F; --heat:79,191,134;
  --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:14px;line-height:1.6;margin:0;padding:0 16px 48px}
.wrap{max-width:1080px;margin:0 auto}
h1,h2,h3{text-wrap:balance;margin:0}
button,select,input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-family:var(--num);font-variant-numeric:tabular-nums}

header{padding-block:28px 20px;display:grid;grid-template-columns:1fr auto;gap:16px 32px;align-items:end;border-bottom:1px solid var(--line)}
.topline{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.eyebrow{font-size:12px;letter-spacing:.14em;color:var(--muted);text-transform:uppercase}
.lang{display:inline-flex;border:1px solid var(--line);border-radius:4px;overflow:hidden}
.lang button{background:none;border:0;padding:3px 10px;cursor:pointer;font-size:12px;color:var(--muted)}
.lang button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
h1{font-size:clamp(34px,6vw,56px);font-weight:900;letter-spacing:.02em;line-height:1.05;margin-top:8px;font-family:"Noto Sans SC",var(--sans)}
html[lang="en"] h1{font-family:var(--num);font-weight:700;letter-spacing:.01em;text-transform:uppercase}
h1 em{font-style:normal;color:var(--accent)}
.meta{display:flex;gap:24px;flex-wrap:wrap}
.meta div{display:flex;flex-direction:column}
.meta b{font-family:var(--num);font-size:30px;font-weight:700;line-height:1}
.meta span{font-size:12px;color:var(--muted);letter-spacing:.04em}
.upd{font-size:12px;color:var(--muted);margin-top:6px}
@media (max-width:640px){header{grid-template-columns:1fr}}

.fav{padding-block:24px;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:32px;border-bottom:1px solid var(--line)}
@media (max-width:820px){.fav{grid-template-columns:1fr}}
.fav h2{font-size:15px;font-weight:700;margin-bottom:12px}
.bars{display:grid;gap:7px}
.bar{display:grid;grid-template-columns:120px 1fr 46px 46px;gap:10px;align-items:center}
.bar.hd{font-size:11px;color:var(--muted);letter-spacing:.04em}
.bar.hd span:nth-child(n+3){text-align:right}
.bar .nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:500}
.bar .tr{height:16px;background:var(--surface2);border-radius:2px;position:relative}
.bar .tk{position:absolute;top:-3px;bottom:-3px;width:3px;margin-left:-1.5px;border-radius:2px;background:var(--ink)}
.bar .fl{height:100%;background:var(--accent);border-radius:0 4px 4px 0;transition:width .6s ease}
.bar:first-child .fl{background:var(--gold)}
.bar .v{font-family:var(--num);font-size:17px;font-weight:600;text-align:right}
.bar .mv{font-family:var(--num);font-size:16px;text-align:right;color:var(--muted)}
.keyl{display:flex;gap:16px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin:-4px 0 12px}
.keyl i{display:inline-block;vertical-align:middle;margin-right:6px}
.keyl .k1{width:14px;height:10px;background:var(--accent);border-radius:2px}
.keyl .k2{width:3px;height:14px;background:var(--ink);border-radius:2px}
.srcnote{font-size:12px;color:var(--muted);margin-top:10px;line-height:1.5}
.trend{position:relative}
.trend svg{width:100%;height:auto;display:block;overflow:visible}
.trend .empty{color:var(--muted);font-size:13px;padding:18px;border:1px dashed var(--line);border-radius:4px}
.lgd{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-top:6px}
.lgd i{display:inline-block;width:10px;height:3px;border-radius:2px;vertical-align:middle;margin-right:5px}
.tip{position:absolute;pointer-events:none;background:var(--surface);border:1px solid var(--line);border-radius:4px;padding:6px 10px;font-size:12px;box-shadow:0 4px 14px rgba(0,0,0,.12);white-space:nowrap}
.tip b{font-family:var(--num);font-size:14px}
.headline{margin-top:14px;color:var(--muted);font-size:13px}
.headline b{color:var(--ink)}

nav{display:flex;gap:4px;flex-wrap:wrap;padding-block:16px 12px;position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);z-index:5}
nav button{border:1px solid var(--line);background:var(--surface);padding:7px 14px;border-radius:999px;cursor:pointer;font-weight:500}
nav button[aria-selected="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:18px}
.panel h3{font-size:16px;margin-bottom:4px}
.hint{color:var(--muted);font-size:13px;margin:0 0 14px}

/* matches */
.mdbar{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:14px}
.mdbar button{border:1px solid var(--line);background:none;border-radius:4px;padding:4px 10px;cursor:pointer;font-family:var(--num);font-size:15px;min-width:44px}
.mdbar button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.mdbar button.done{color:var(--muted)}
.acc{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;margin-bottom:16px}
.acc div{background:var(--surface2);border-radius:4px;padding:10px 12px}
.acc b{font-family:var(--num);font-size:26px;line-height:1;display:block}
.acc span{font-size:12px;color:var(--muted)}
.day{font-size:12px;letter-spacing:.08em;color:var(--muted);margin:16px 0 2px}
.mr{display:grid;grid-template-columns:52px minmax(0,1fr) 62px minmax(0,1fr) minmax(170px,230px);gap:10px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line)}
.mr .tm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mr .tm.h{text-align:right}
.mr .t{font-family:var(--num);color:var(--muted);font-size:14px}
.sc{text-align:center;font-family:var(--num);font-size:19px;font-weight:700;background:var(--surface2);border-radius:3px}
.sc.pending{font-weight:500;color:var(--muted);font-size:13px;background:none;border:1px dashed var(--line)}
.pp{display:grid;gap:3px}
.pl{display:grid;grid-template-columns:34px 1fr auto;gap:6px;align-items:center;font-size:11px;color:var(--muted)}
.mini{display:flex;height:9px;border-radius:2px;overflow:hidden;gap:2px;background:var(--surface)}
.mini div{height:100%}
.mini .h{background:var(--win)}.mini .d{background:var(--draw)}.mini .a{background:var(--loss)}
.pv{font-family:var(--num);font-size:13px;color:var(--ink);white-space:nowrap;font-variant-numeric:tabular-nums}
.pick{font-size:11px;padding:0 6px;border-radius:999px;margin-left:4px}
.pick.y{background:rgba(var(--heat),.18);color:var(--accent)}
.pick.n{background:var(--surface2);color:var(--muted)}
@media (max-width:640px){.mr{grid-template-columns:minmax(0,1fr) 56px minmax(0,1fr)}.mr .t{grid-column:1/-1;order:-1}.mr .pp{grid-column:1/-1}}

.tw{overflow-x:auto;-webkit-overflow-scrolling:touch}
table{border-collapse:collapse;width:100%;min-width:720px}
th,td{padding:6px 8px;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-size:12px;font-weight:500;color:var(--muted);letter-spacing:.04em}
td{font-family:var(--num);font-size:16px;font-variant-numeric:tabular-nums}
th:nth-child(2),td:nth-child(2){text-align:left}
td.tm{font-family:var(--sans);font-size:14px;font-weight:500}
td.tm small{color:var(--muted);font-weight:400;margin-left:6px;font-family:var(--num);font-size:13px}
td.rk{color:var(--muted);width:32px}
tr.cut td{border-bottom:2px solid var(--ink)}
tr.cut2 td{border-bottom:2px dashed var(--muted)}
.zone{display:inline-block;width:6px;height:6px;border-radius:50%;margin-right:8px;vertical-align:middle}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-top:12px}
.up{color:var(--win)} .dn{color:var(--loss)}

.mp{display:grid;grid-template-columns:1fr auto 1fr;gap:12px;align-items:end}
.mp label{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted)}
.mp select{padding:9px 10px;border:1px solid var(--line);border-radius:4px;background:var(--surface);font-size:15px;color:var(--ink)}
.vs{font-family:var(--num);font-size:22px;font-weight:700;padding-bottom:6px;color:var(--muted)}
.opts{display:flex;gap:16px;align-items:center;margin-top:12px;flex-wrap:wrap}
.opts label{display:flex;gap:6px;align-items:center;cursor:pointer}
.res{margin-top:20px;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:28px}
@media (max-width:720px){.res{grid-template-columns:1fr}.mp{grid-template-columns:1fr}.vs{padding:0;text-align:center}}
.three{display:flex;height:44px;border-radius:4px;overflow:hidden;gap:2px}
.three div{display:flex;align-items:center;justify-content:center;color:#fff;font-family:var(--num);font-size:19px;font-weight:600;min-width:0;overflow:hidden}
.three .h{background:var(--win)} .three .d{background:var(--draw)} .three .a{background:var(--loss)}
.three-lab{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);margin-top:6px;gap:8px}
.xg{display:flex;gap:28px;margin-top:18px}
.xg b{font-family:var(--num);font-size:30px;display:block;line-height:1}
.xg span{font-size:12px;color:var(--muted)}
.note{margin-top:14px;font-size:13px;padding:8px 12px;background:var(--surface2);border-radius:4px}
.grid{display:grid;grid-template-columns:28px repeat(6,1fr);gap:3px;font-family:var(--num);font-variant-numeric:tabular-nums}
.grid div{text-align:center;padding:6px 0;font-size:14px;border-radius:2px}
.grid .hd{color:var(--muted);font-size:12px}
.sect{font-size:12px;letter-spacing:.08em;color:var(--muted);margin:18px 0 6px}
.top5{display:flex;gap:8px;flex-wrap:wrap}
.chip{border:1px solid var(--line);border-radius:999px;padding:3px 10px;font-family:var(--num);font-size:15px}
.chip i{font-style:normal;color:var(--muted);margin-left:6px;font-size:13px}

.rt{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:2px 24px}
.rt label{display:grid;grid-template-columns:1fr 54px 80px;gap:8px;align-items:center;padding:5px 0;border-bottom:1px solid var(--line)}
.rt .dl{font-family:var(--num);font-size:14px;text-align:right}
.rt input{width:80px;padding:4px 6px;border:1px solid var(--line);border-radius:3px;background:var(--surface);font-family:var(--num);font-size:16px;text-align:right}
.rt input.changed{border-color:var(--gold);color:var(--gold)}
.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.btn{border:1px solid var(--ink);background:var(--ink);color:var(--bg);padding:8px 16px;border-radius:4px;cursor:pointer;font-weight:500}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--line)}
.btn:disabled{opacity:.5;cursor:wait}
.banner{display:none;margin-top:12px;padding:8px 12px;border-radius:4px;background:rgba(var(--heat),.12);font-size:13px}
.banner.on{display:flex;gap:12px;align-items:center;flex-wrap:wrap}

.about{margin-top:28px;display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:24px;color:var(--muted);font-size:13px}
.about h3{color:var(--ink);font-size:14px;margin-bottom:6px}
.about p{margin:0}
.err{padding:40px 0;color:var(--loss)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<div class="wrap">
<header>
  <div>
    <div class="topline">
      <span class="eyebrow" data-i="eyebrow"></span>
      <span class="lang" role="group" aria-label="Language"><button type="button" data-lang="zh">中文</button><button type="button" data-lang="en">EN</button></span>
    </div>
    <h1 id="h1"></h1>
    <div class="upd" id="upd"></div>
  </div>
  <div class="meta">
    <div><b class="num" id="m-played">–</b><span data-i="mPlayed"></span></div>
    <div><b class="num" id="m-next">–</b><span data-i="mNext"></span></div>
    <div><b class="num" id="m-sims">–</b><span data-i="mSims"></span></div>
  </div>
</header>

<section class="fav">
  <div>
    <h2 data-i="favTitle"></h2>
    <div class="keyl" id="keyl"></div>
    <div class="bars" id="bars"></div>
    <div class="srcnote" id="srcnote"></div>
    <div class="headline" id="headline"></div>
  </div>
  <div>
    <h2 data-i="trendTitle"></h2>
    <div class="trend" id="trend"></div>
  </div>
</section>
<div class="banner" id="custom-banner"><span data-i="customOn"></span><button class="btn ghost" type="button" id="custom-off" data-i="customOff"></button></div>

<nav role="tablist" id="tabs">
  <button role="tab" type="button" data-t="matches" data-i="tMatches"></button>
  <button role="tab" type="button" data-t="table" data-i="tTable"></button>
  <button role="tab" type="button" data-t="standings" data-i="tStand"></button>
  <button role="tab" type="button" data-t="match" data-i="tMatch"></button>
  <button role="tab" type="button" data-t="ratings" data-i="tRatings"></button>
</nav>

<div class="panel" id="p-matches" hidden>
  <div class="acc" id="acc"></div>
  <div class="mdbar" id="mdbar"></div>
  <div id="mlist"></div>
</div>

<div class="panel" id="p-table" hidden>
  <h3 data-i="tableH"></h3>
  <p class="hint" data-i="tableHint"></p>
  <div class="tw"><table id="t-prob"></table></div>
</div>

<div class="panel" id="p-standings" hidden>
  <h3 id="standH"></h3>
  <p class="hint" data-i="standHint"></p>
  <div class="tw"><table id="t-stand"></table></div>
  <div class="legend">
    <span><i class="zone" style="background:var(--accent)"></i><span data-i="z1"></span></span>
    <span><i class="zone" style="background:var(--gold)"></i><span data-i="z2"></span></span>
    <span><i class="zone" style="background:var(--line)"></i><span data-i="z3"></span></span>
  </div>
</div>

<div class="panel" id="p-match" hidden>
  <h3 data-i="matchH"></h3>
  <p class="hint" data-i="matchHint"></p>
  <div class="mp">
    <label for="sel-h"><span data-i="home"></span><select id="sel-h"></select></label>
    <div class="vs">VS</div>
    <label for="sel-a"><span data-i="away"></span><select id="sel-a"></select></label>
  </div>
  <div class="opts">
    <label><input type="checkbox" id="neutral"> <span data-i="neutral"></span></label>
    <button class="btn ghost" id="swap" type="button" data-i="swap"></button>
  </div>
  <div class="res">
    <div>
      <div class="three" id="three"></div>
      <div class="three-lab" id="three-lab"></div>
      <div class="xg" id="xg"></div>
      <div id="mnote"></div>
    </div>
    <div>
      <div class="sect" style="margin-top:0" data-i="gridH"></div>
      <div class="grid" id="grid"></div>
      <div class="sect" data-i="topScores"></div>
      <div class="top5" id="top5"></div>
    </div>
  </div>
</div>

<div class="panel" id="p-ratings" hidden>
  <h3 data-i="ratH"></h3>
  <p class="hint" id="ratHint"></p>
  <div class="toolbar">
    <button class="btn" id="rerun" type="button" data-i="rerun"></button>
    <button class="btn ghost" id="reset" type="button" data-i="reset"></button>
    <span class="hint" id="rstat" style="margin:0"></span>
  </div>
  <div class="rt" id="rt"></div>
</div>

<section class="about" id="about"></section>
</div>

let LANG=store.get("lang",(navigator.language||"").toLowerCase().startsWith("zh")?"zh":"en");
const L=()=>I18N[LANG];
const fmt=(s,o)=>s.replace(/\{(\w+)\}/g,(_,k)=>o[k]!=null?o[k]:"");
const pct=(p,d)=>{ if(p==null) return "–"; if(p<=0) return "–"; const v=p*100; if(v<0.1) return "<0.1"; if(v>99.9&&v<100) return ">99.9"; return v.toFixed(d==null?(v<10?1:0):d); };
const heat=p=>p<=0?"":`background:rgba(var(--heat),${(0.08+0.62*Math.sqrt(p)).toFixed(3)});${p>.55?"color:var(--accent-ink)":""}`;

// ---------- state ----------
let D=null, TEAMS=[], N=0, K={}, ELO=[], OFF=null, RES=null, CUSTOM=false, CELO=null;
const nm=t=>LANG==="zh"?TEAMS[t].zh:TEAMS[t].en;

// ---------- model (same as update.py) ----------
let HFA=65,BASE=1.38,SCALE=1050;
const lam=d=>[BASE*Math.pow(10,d/SCALE),BASE*Math.pow(10,-d/SCALE)];
function pmf(l,k){ let p=Math.exp(-l); for(let i=1;i<=k;i++) p*=l/i; return p; }
function probs(h,a,neutral,elo){
  const [lh,la]=lam(elo[h]-elo[a]+(neutral?0:HFA)); let H=0,Dr=0,A=0; const m=[];
  for(let i=0;i<=10;i++){ m[i]=[]; for(let j=0;j<=10;j++){ const p=pmf(lh,i)*pmf(la,j); m[i][j]=p; if(i>j)H+=p; else if(i===j)Dr+=p; else A+=p; } }
  const s=H+Dr+A; return {H:H/s,D:Dr/s,A:A/s,lh,la,m};
}
function pois(l){ const L=Math.exp(-l); let k=0,p=1; do{k++;p*=Math.random();}while(p>L); return k-1; }
function addRes(pts,gd,gf,h,a,x,y){ gf[h]+=x; gf[a]+=y; gd[h]+=x-y; gd[a]+=y-x; if(x>y) pts[h]+=3; else if(x<y) pts[a]+=3; else {pts[h]++;pts[a]++;} }
function simulate(S,elo){
  const keys=["top8","top24","r16","qf","sf","fin","win","pts","pos"], c={}; keys.forEach(k=>c[k]=new Float64Array(N));
  const bp=new Int32Array(N),bgd=new Int32Array(N),bgf=new Int32Array(N), rem=[];
  for(const m of D.matches){ const h=K[m.h],a=K[m.a]; if(m.state==="post") addRes(bp,bgd,bgf,h,a,m.score[0],m.score[1]); else rem.push([h,a]); }
  const play=(h,a,neu,f)=>{ const [lh,la]=lam(elo[h]-elo[a]+(neu?0:HFA)); return [pois(lh*(f||1)),pois(la*(f||1))]; };
  const tie=(lo,hi)=>{ const g1=play(lo,hi),g2=play(hi,lo),al=g1[0]+g2[1],ah=g1[1]+g2[0]; if(al!==ah) return al>ah?lo:hi; const e=play(hi,lo,false,1/3); if(e[0]!==e[1]) return e[0]>e[1]?hi:lo; return Math.random()<.5?lo:hi; };
  const fin=(a,b)=>{ let g=play(a,b,true); if(g[0]!==g[1]) return g[0]>g[1]?a:b; g=play(a,b,true,1/3); if(g[0]!==g[1]) return g[0]>g[1]?a:b; return Math.random()<.5?a:b; };
  const sh=(x,y)=>Math.random()<.5?[x,y]:[y,x];
  const pts=new Int32Array(N),gd=new Int32Array(N),gf=new Int32Array(N),rnd=new Float64Array(N),R=[...Array(N).keys()],rank=new Int32Array(N);
  for(let s=0;s<S;s++){
    pts.set(bp);gd.set(bgd);gf.set(bgf);
    for(const [h,a] of rem){ const g=play(h,a); addRes(pts,gd,gf,h,a,g[0],g[1]); }
    for(let i=0;i<N;i++) rnd[i]=Math.random();
    R.sort((x,y)=>pts[y]-pts[x]||gd[y]-gd[x]||gf[y]-gf[x]||rnd[y]-rnd[x]);
    R.forEach((t,i)=>{ rank[t]=i; c.pts[t]+=pts[t]; c.pos[t]+=i+1; if(i<8)c.top8[t]++; if(i<24)c.top24[t]++; });
    const pw=[[8,22],[10,20],[12,18],[14,16]].map(([u,l])=>{ const lo=sh(R[l],R[l+1]); return [tie(lo[0],R[u]),tie(lo[1],R[u+1])]; });
    const r16=[]; for(let k=0;k<4;k++){ const w=sh(pw[3-k][0],pw[3-k][1]); r16.push([R[2*k],w[0]],[R[2*k+1],w[1]]); }
    const W=r16.map(([hi,lo])=>{ c.r16[hi]++; c.r16[lo]++; return tie(lo,hi); });
    const ko=(a,b)=>rank[a]<rank[b]?tie(b,a):tie(a,b);
    const p78=sh(W[6],W[7]),p34=sh(W[2],W[3]),p56=sh(W[4],W[5]);
    const qw=[[W[0],p78[0]],[p34[0],p56[0]],[W[1],p78[1]],[p34[1],p56[1]]].map(([a,b])=>{ c.qf[a]++;c.qf[b]++; return ko(a,b); });
    const sw=[[qw[0],qw[1]],[qw[2],qw[3]]].map(([a,b])=>{ c.sf[a]++;c.sf[b]++; return ko(a,b); });
    c.fin[sw[0]]++; c.fin[sw[1]]++; c.win[fin(sw[0],sw[1])]++;
  }
  const out={}; for(const k of keys) out[k]=Array.from(c[k],v=>v/S); return out;
}
function fromData(){ const out={}; for(const k in D.sim) out[k]=TEAMS.map(t=>D.sim[k][t.key]); return out; }

// ---------- derived ----------
let CUR=null;
function current(){
  const z=()=>new Int32Array(N), r={pts:z(),gd:z(),gf:z(),ga:z(),pl:z(),w:z(),d:z(),l:z()};
  for(const m of D.matches) if(m.state==="post"){ const h=K[m.h],a=K[m.a],[x,y]=m.score; addRes(r.pts,r.gd,r.gf,h,a,x,y); r.pl[h]++;r.pl[a]++; r.ga[h]+=y; r.ga[a]+=x;
    if(x>y){r.w[h]++;r.l[a]++;} else if(x<y){r.w[a]++;r.l[h]++;} else {r.d[h]++;r.d[a]++;} }
  return r;
}
const outcome=s=>s[0]>s[1]?0:s[0]===s[1]?1:2;
const argmax=p=>p.indexOf(Math.max(...p));

// ---------- render ----------
function applyStatic(){
  document.documentElement.lang=LANG==="zh"?"zh-CN":"en";
  document.title=LANG==="zh"?"欧冠推演室":"UCL Simulator";
  document.querySelectorAll("[data-i]").forEach(el=>{ const v=L()[el.dataset.i]; if(typeof v==="string") el.innerHTML=v; });
  $("h1").innerHTML=L().h1;
  document.querySelectorAll(".lang button").forEach(b=>b.setAttribute("aria-pressed",b.dataset.lang===LANG));
  $("about").innerHTML=L().about.map(([h,p])=>`<div><h3>${h}</h3><p>${p}</p></div>`).join("");
}
function renderAll(){
  applyStatic();
  if(!D) return;
  const r=RES, played=D.matches.filter(m=>m.state==="post").length;
  const t=new Date(D.updated);
  $("upd").textContent=`${L().updated} ${t.toLocaleString(LANG==="zh"?"zh-CN":"en-GB",{dateStyle:"medium",timeStyle:"short"})}`;
  $("m-played").textContent=`${played}/${D.matches.length}`;
  const nx=D.matches.filter(m=>m.state!=="post").sort((a,b)=>a.date<b.date?-1:1)[0];
  $("m-next").textContent=nx?new Date(nx.date).toLocaleDateString(LANG==="zh"?"zh-CN":"en-GB",{month:"short",day:"numeric"}):"–";
  $("m-sims").textContent=(CUSTOM?10000:(D.model.sims||10000)).toLocaleString("en-US");
  $("custom-banner").classList.toggle("on",CUSTOM);
  const byWin=[...Array(N).keys()].sort((a,b)=>r.win[b]-r.win[a]||r.fin[b]-r.fin[a]||r.r16[b]-r.r16[a]);
  const MW=TEAMS.map(t=>D.outright&&D.outright.p[t.key]!=null?D.outright.p[t.key]:null);
  const top=byWin.slice(0,10), mx=Math.max(...top.map(t=>Math.max(r.win[t],MW[t]||0)))||1;
  $("keyl").innerHTML=`<span><i class="k1"></i>${L().kModel}</span>`+(D.outright?`<span><i class="k2"></i>${L().kMarket}</span>`:"");
  $("bars").innerHTML=`<div class="bar hd"><span></span><span></span><span>${L().colSim}</span><span>${D.outright?L().colMkt:""}</span></div>`+top.map(t=>`<div class="bar"><span class="nm">${nm(t)}</span><div class="tr"><div class="fl" style="width:${(r.win[t]/mx*100).toFixed(1)}%"></div>${MW[t]!=null?`<div class="tk" style="left:${(MW[t]/mx*100).toFixed(1)}%"></div>`:""}</div><span class="v">${pct(r.win[t],1)}%</span><span class="mv">${MW[t]!=null?pct(MW[t],1)+"%":""}</span></div>`).join("");
  const nOdds=D.matches.filter(m=>m.state!=="post"&&D.pred[m.id]&&D.pred[m.id].market).length, nRest=D.matches.filter(m=>m.state!=="post").length-nOdds;
  const loc=LANG==="zh"?"zh-CN":"en-GB";
  $("srcnote").innerHTML=(CUSTOM?"":fmt(L().srcNote,{n:nOdds,m:nRest,s:(D.model.sims||10000).toLocaleString("en-US")})+" ")+(D.outright?fmt(L().srcMkt,{t:new Date(D.outright.t).toLocaleDateString(loc,{month:"short",day:"numeric"}),v:"$"+(D.outright.volume/1e6).toFixed(1)+"M"}):"");
  const f=byWin[0], dk=[...Array(N).keys()].filter(t=>TEAMS[t].pot>=3).sort((a,b)=>r.qf[b]-r.qf[a])[0];
  let split="";
  if(D.outright){ const g=[...Array(N).keys()].filter(t=>MW[t]!=null).sort((a,b)=>Math.abs(r.win[b]-MW[b])-Math.abs(r.win[a]-MW[a]))[0];
    split=" "+fmt(L().split,{t:nm(g),a:pct(r.win[g],1),b:pct(MW[g],1)}); }
  $("headline").innerHTML=fmt(L().side,{t:nm(f),w:pct(r.win[f],1),f:pct(r.fin[f],0),d:nm(dk),q:pct(r.qf[dk],0)})+split;
  renderTrend(); renderMatches(); renderTable(byWin); renderStandings(); fillSelects(); renderMatch(); renderRatings();
}

function renderTrend(){
  const H=D.history||[], box=$("trend");
  if(H.length<2){ box.innerHTML=`<div class="empty">${L().trendEmpty}</div>`; return; }
  const last=H[H.length-1], ids=Object.keys(last.win).sort((a,b)=>last.win[b]-last.win[a]).slice(0,4);
  const W=520,Hh=210,ml=34,mr=48,mt=10,mb=24, xs=i=>ml+(W-ml-mr)*(H.length===1?0:i/(H.length-1));
  const ymax=Math.max(.05,...H.flatMap(h=>ids.map(k=>h.win[k]||0)));
  const step=ymax>.3?.1:ymax>.15?.05:.02, top=Math.ceil(ymax/step)*step, ys=v=>mt+(Hh-mt-mb)*(1-v/top);
  let g=""; for(let v=0;v<=top+1e-9;v+=step){ g+=`<line x1="${ml}" x2="${W-mr}" y1="${ys(v)}" y2="${ys(v)}" style="stroke:var(--line)" stroke-width="1"/><text x="${ml-6}" y="${ys(v)+4}" text-anchor="end" font-size="11" style="fill:var(--muted);font-family:var(--num)">${Math.round(v*100)}%</text>`; }
  const dl=h=>new Date(h.t).toLocaleDateString(LANG==="zh"?"zh-CN":"en-GB",{month:"numeric",day:"numeric"});
  g+=`<text x="${xs(0)}" y="${Hh-6}" font-size="11" style="fill:var(--muted)">${dl(H[0])}</text><text x="${xs(H.length-1)}" y="${Hh-6}" text-anchor="end" font-size="11" style="fill:var(--muted)">${dl(last)}</text>`;
  const lab=[]; ids.forEach((k,i)=>{ const pts=H.map((h,j)=>`${xs(j).toFixed(1)},${ys(h.win[k]||0).toFixed(1)}`).join(" ");
    g+=`<polyline points="${pts}" fill="none" style="stroke:var(--s${i+1})" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><circle cx="${xs(H.length-1)}" cy="${ys(last.win[k])}" r="4" style="fill:var(--s${i+1});stroke:var(--surface)" stroke-width="2"/>`;
    lab.push({k,i,y:ys(last.win[k])}); });
  lab.sort((a,b)=>a.y-b.y); for(let i=1;i<lab.length;i++) if(lab[i].y-lab[i-1].y<13) lab[i].y=lab[i-1].y+13;
  const ti=k=>TEAMS[K[k]];
  lab.forEach(o=>g+=`<text x="${W-mr+8}" y="${o.y+4}" font-size="12" style="fill:var(--ink);font-family:var(--num)">${ti(o.k).short}</text>`);
  g+=`<line id="xh" x1="0" x2="0" y1="${mt}" y2="${Hh-mb}" style="stroke:var(--muted)" stroke-width="1" stroke-dasharray="3 3" visibility="hidden"/><rect id="hit" x="${ml}" y="${mt}" width="${W-ml-mr}" height="${Hh-mt-mb}" fill="transparent"/>`;
  box.innerHTML=`<svg viewBox="0 0 ${W} ${Hh}" role="img" aria-label="${L().trendTitle}">${g}</svg><div class="lgd">${ids.map((k,i)=>`<span><i style="background:var(--s${i+1})"></i>${LANG==="zh"?ti(k).zh:ti(k).en}</span>`).join("")}</div><div class="tip" id="tip" hidden></div>`;
  const svg=box.querySelector("svg"), tip=$("tip"), xh=box.querySelector("#xh");
  const move=e=>{ const rc=svg.getBoundingClientRect(), x=(e.clientX-rc.left)*W/rc.width;
    let j=Math.round((x-ml)/((W-ml-mr)/(H.length-1))); j=Math.max(0,Math.min(H.length-1,j));
    xh.setAttribute("x1",xs(j)); xh.setAttribute("x2",xs(j)); xh.setAttribute("visibility","visible");
    tip.hidden=false; tip.innerHTML=`<div>${dl(H[j])}</div>`+ids.map((k,i)=>`<div><i style="display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--s${i+1});margin-right:6px"></i>${ti(k).short} <b>${pct(H[j].win[k],1)}%</b></div>`).join("");
    const px=xs(j)*rc.width/W; tip.style.left=Math.min(px+12,rc.width-tip.offsetWidth)+"px"; tip.style.top="8px"; };
  svg.querySelector("#hit").addEventListener("pointermove",move);
  svg.addEventListener("pointerleave",()=>{ tip.hidden=true; xh.setAttribute("visibility","hidden"); });
}

let MD=null;
function renderMatches(){
  // accuracy
  const done=D.matches.filter(m=>m.state==="post"&&D.pred[m.id]);
  let mh=0,brier=0,kh=0,kn=0;
  for(const m of done){ const p=D.pred[m.id], o=outcome(m.score); if(argmax(p.model)===o) mh++; brier+=p.model.reduce((s,v,i)=>s+(v-(i===o?1:0))**2,0);
    if(p.market){ kn++; if(argmax(p.market.p)===o) kh++; } }
  $("acc").innerHTML=done.length?`<div><b>${mh}/${done.length}</b><span>${L().accModel} · ${pct(mh/done.length,0)}%</span></div>
    <div><b>${kn?`${kh}/${kn}`:"–"}</b><span>${kn?`${L().accMarket} · ${pct(kh/kn,0)}%`:L().accMarketNone}</span></div>
    <div><b>${(brier/done.length).toFixed(3)}</b><span>${L().accBrier}<br>${L().accBrierHint}</span></div>`:`<div><span>${L().accNone}</span></div>`;
  const mds=[...new Set(D.matches.map(m=>m.md))].sort((a,b)=>a-b);
  if(MD==null){ const nx=D.matches.filter(m=>m.state!=="post").sort((a,b)=>a.date<b.date?-1:1)[0]; MD=nx?nx.md:mds[mds.length-1]; }
  $("mdbar").innerHTML=mds.map(n=>{ const all=D.matches.filter(m=>m.md===n), fin=all.every(m=>m.state==="post");
    return `<button type="button" data-md="${n}" aria-pressed="${n===MD}" class="${fin?"done":""}" title="${fmt(L().md,{n})}">${fmt(L().mdShort,{n})}</button>`; }).join("");
  const list=D.matches.filter(m=>m.md===MD).sort((a,b)=>a.date<b.date?-1:a.date>b.date?1:0);
  const loc=LANG==="zh"?"zh-CN":"en-GB"; let html=`<p class="hint">${fmt(L().md,{n:MD})} · ${L().mdNote} ${list.some(m=>m.state==="post")?L().mdNoteDone:""}</p>`, lastDay="";
  for(const m of list){
    const dt=new Date(m.date), day=dt.toLocaleDateString(loc,{weekday:"short",month:"short",day:"numeric"});
    if(day!==lastDay){ html+=`<div class="day">${day}</div>`; lastDay=day; }
    const p=D.pred[m.id]||{}, h=K[m.h], a=K[m.a], res=m.state==="post"?outcome(m.score):null;
    const sc=m.state==="post"?`<div class="sc">${m.score[0]}–${m.score[1]}</div>`:`<div class="sc pending">${m.state==="in"?L().live:L().pending}</div>`;
    const line=(lab,pr,extra)=>{ if(!pr) return ""; const hit=res==null?"":argmax(pr)===res?`<span class="pick y">${L().hit}</span>`:`<span class="pick n">${L().miss}</span>`;
      return `<div class="pl"><span>${lab}${extra||""}</span><div class="mini"><div class="h" style="flex:${pr[0]}"></div><div class="d" style="flex:${pr[1]}"></div><div class="a" style="flex:${pr[2]}"></div></div><span class="pv">${pct(pr[0],0)} · ${pct(pr[1],0)} · ${pct(pr[2],0)}${hit}</span></div>`; };
    const b=(t,w)=>w?`<b>${nm(t)}</b>`:nm(t);
    html+=`<div class="mr"><span class="t">${dt.toLocaleTimeString(loc,{hour:"2-digit",minute:"2-digit"})}</span><span class="tm h">${b(h,res===0)}</span>${sc}<span class="tm">${b(a,res===2)}</span>
      <div class="pp">${line(L().model,p.model,p.backfill?"*":"")}${line(L().market,p.market&&p.market.p)}</div></div>`;
  }
  $("mlist").innerHTML=html;
}
$("mdbar").addEventListener("click",e=>{ const b=e.target.closest("button[data-md]"); if(!b) return; MD=+b.dataset.md; renderMatches(); });

function renderTable(byWin){
  const r=RES, c=L().cols, cols=["top8","top24","r16","qf","sf","fin","win"], op=D.outright?D.outright.p:null;
  $("t-prob").innerHTML=`<thead><tr><th>${c.rk}</th><th>${c.team}</th><th>${c.elo}</th><th>${c.pts}</th><th>${c.xpts}</th>${cols.map(k=>`<th>${c[k]}</th>`).join("")}${op?`<th>${c.mwin}</th>`:""}</tr></thead><tbody>`+
   byWin.map((t,i)=>`<tr><td class="rk">${i+1}</td><td class="tm">${nm(t)}<small>${TEAMS[t].short}</small></td><td>${Math.round(ELO[t])}</td><td>${CUR.pts[t]}</td><td>${r.pts[t].toFixed(1)}</td>${cols.map(k=>`<td style="${heat(r[k][t])}">${pct(r[k][t])}</td>`).join("")}${op?`<td style="color:var(--muted)">${pct(op[TEAMS[t].key])}</td>`:""}</tr>`).join("")+"</tbody>";
}
function renderStandings(){
  const r=RES, c=L().cols, played=D.matches.filter(m=>m.state==="post").length;
  $("standH").textContent=fmt(L().standH,{n:played});
  const st=[...Array(N).keys()].sort((a,b)=>CUR.pts[b]-CUR.pts[a]||CUR.gd[b]-CUR.gd[a]||CUR.gf[b]-CUR.gf[a]||r.pos[a]-r.pos[b]);
  $("t-stand").innerHTML=`<thead><tr><th>${c.rk}</th><th>${c.team}</th><th>${c.p}</th><th>${c.w}</th><th>${c.d}</th><th>${c.l}</th><th>${c.gf}</th><th>${c.ga}</th><th>${c.gd}</th><th>${c.pts}</th><th>${c.xpos}</th><th>${c.xpts}</th></tr></thead><tbody>`+
   st.map((t,i)=>{ const z=i<8?"var(--accent)":i<24?"var(--gold)":"var(--line)";
    return `<tr class="${i===7?"cut":i===23?"cut2":""}"><td class="rk">${i+1}</td><td class="tm"><i class="zone" style="background:${z}"></i>${nm(t)}</td><td>${CUR.pl[t]}</td><td>${CUR.w[t]}</td><td>${CUR.d[t]}</td><td>${CUR.l[t]}</td><td>${CUR.gf[t]}</td><td>${CUR.ga[t]}</td><td>${CUR.gd[t]>0?"+":""}${CUR.gd[t]}</td><td><b>${CUR.pts[t]}</b></td><td>${r.pos[t].toFixed(1)}</td><td>${r.pts[t].toFixed(1)}</td></tr>`; }).join("")+"</tbody>";
}

function fillSelects(){
  const opts=[...Array(N).keys()].sort((a,b)=>TEAMS[a].pot-TEAMS[b].pot||OFF[b]-OFF[a]).map(t=>`<option value="${t}">${nm(t)}</option>`).join("");
  for(const id of ["sel-h","sel-a"]){ const v=$(id).value; $(id).innerHTML=opts; $(id).value=v||(id==="sel-h"?K.ARS:K.RMA); }
}
function renderMatch(){
  const h=+$("sel-h").value, a=+$("sel-a").value, neu=$("neutral").checked;
  if(h===a){ ["three","three-lab","xg","grid","top5"].forEach(i=>$(i).innerHTML=""); $("mnote").innerHTML=`<div class="note">${L().same}</div>`; return; }
  const p=probs(h,a,neu,ELO);
  $("three").innerHTML=`<div class="h" style="flex:${p.H}">${pct(p.H,0)}%</div><div class="d" style="flex:${p.D}">${pct(p.D,0)}%</div><div class="a" style="flex:${p.A}">${pct(p.A,0)}%</div>`;
  $("three-lab").innerHTML=`<span>${fmt(L().win,{t:nm(h)})}</span><span>${L().draw}</span><span>${fmt(L().win,{t:nm(a)})}</span>`;
  $("xg").innerHTML=`<div><b>${p.lh.toFixed(2)}</b><span>${fmt(L().xg,{t:nm(h)})}</span></div><div><b>${p.la.toFixed(2)}</b><span>${fmt(L().xg,{t:nm(a)})}</span></div>`;
  const real=D.matches.find(m=>(K[m.h]===h&&K[m.a]===a)||(K[m.h]===a&&K[m.a]===h));
  let note=L().hypo;
  if(real){ if(real.state==="post") note=fmt(L().realPlayed,{md:real.md,h:nm(K[real.h]),a:nm(K[real.a]),x:real.score[0],y:real.score[1]});
    else { const mk=(D.pred[real.id]||{}).market; note=fmt(L().realTodo,{md:real.md,h:nm(K[real.h]),mk:mk?fmt(L().realMk,{h:pct(mk.p[0],0),d:pct(mk.p[1],0),a:pct(mk.p[2],0)}):""}); } }
  $("mnote").innerHTML=`<div class="note">${note}</div>`;
  let g=`<div class="hd"></div>`+[0,1,2,3,4,"5+"].map(j=>`<div class="hd">${j}</div>`).join("");
  const cell=(i,j)=>{ let s=0; const ii=i===5?[5,6,7,8,9,10]:[i], jj=j===5?[5,6,7,8,9,10]:[j]; for(const x of ii)for(const y of jj)s+=p.m[x][y]; return s; };
  for(let i=0;i<=5;i++){ g+=`<div class="hd">${i===5?"5+":i}</div>`; for(let j=0;j<=5;j++){ const v=cell(i,j); g+=`<div style="${heat(Math.min(1,v*4))}">${(v*100).toFixed(v<.1?1:0)}</div>`; } }
  $("grid").innerHTML=g;
  const sc=[]; for(let i=0;i<=6;i++)for(let j=0;j<=6;j++) sc.push([i,j,p.m[i][j]]); sc.sort((x,y)=>y[2]-x[2]);
  $("top5").innerHTML=sc.slice(0,5).map(s=>`<span class="chip">${s[0]}–${s[1]}<i>${(s[2]*100).toFixed(1)}%</i></span>`).join("");
}
["sel-h","sel-a","neutral"].forEach(id=>$(id).addEventListener("change",renderMatch));
$("swap").addEventListener("click",()=>{ const h=$("sel-h").value; $("sel-h").value=$("sel-a").value; $("sel-a").value=h; renderMatch(); });

function renderRatings(){
  const rs=D.ratings, src=rs.base_source==="clubelo"?L().srcClubelo:L().srcEstimate;
  $("ratHint").textContent=fmt(L().ratHint,{src,date:rs.base_date});
  const keep=document.activeElement&&document.activeElement.id;
  $("rt").innerHTML=[...Array(N).keys()].sort((a,b)=>OFF[b]-OFF[a]).map(t=>{ const dlt=Math.round(OFF[t]-TEAMS[t].elo0);
    return `<label for="r-${t}"><span>${nm(t)}</span><span class="dl ${dlt>0?"up":dlt<0?"dn":""}">${dlt>0?"+":""}${dlt||"±0"}</span><input id="r-${t}" type="number" step="10" min="1300" max="2400" value="${Math.round(ELO[t])}" class="${Math.round(ELO[t])!==Math.round(OFF[t])?"changed":""}"></label>`; }).join("");
  if(keep&&$(keep)) $(keep).focus();
}
$("rt").addEventListener("change",e=>{ const el=e.target; if(el.tagName!=="INPUT") return; const t=+el.id.slice(2), v=Math.round(+el.value);
  if(Number.isFinite(v)&&v>=1300&&v<=2400){ ELO[t]=v; el.classList.toggle("changed",v!==Math.round(OFF[t])); CELO=CELO||{}; CELO[TEAMS[t].key]=v; store.set("custom",CELO); $("rstat").textContent=L().changed; renderMatch(); } });
function runCustom(){
  const b=$("rerun"); b.disabled=true;
  setTimeout(()=>{ const t0=performance.now(); RES=simulate(10000,ELO); CUSTOM=true; CUR=current(); renderAll();
    b.disabled=false; $("rstat").textContent=fmt(L().done,{n:"10,000",ms:Math.round(performance.now()-t0)}); },30);
}
function official(){ ELO=OFF.slice(); CELO=null; store.set("custom",null); CUSTOM=false; RES=fromData(); $("rstat").textContent=""; renderAll(); }
$("rerun").addEventListener("click",runCustom);
$("reset").addEventListener("click",official);
$("custom-off").addEventListener("click",official);

// tabs & language
const tabs=[...document.querySelectorAll("#tabs button")];
function show(name){ tabs.forEach(b=>{ const on=b.dataset.t===name; b.setAttribute("aria-selected",on); $("p-"+b.dataset.t).hidden=!on; }); store.set("tab",name); }
tabs.forEach(b=>b.addEventListener("click",()=>show(b.dataset.t)));
const hashTab=location.hash.slice(1), saved=store.get("tab",null);
show(tabs.some(b=>b.dataset.t===hashTab)?hashTab:(tabs.some(b=>b.dataset.t===saved)?saved:"matches"));
document.querySelectorAll(".lang button").forEach(b=>b.addEventListener("click",()=>{ LANG=b.dataset.lang; store.set("lang",LANG); renderAll(); }));

applyStatic();
fetch("data.json",{cache:"no-store"}).then(r=>{ if(!r.ok) throw new Error(r.status); return r.json(); }).then(d=>{
  D=d; TEAMS=d.teams; N=TEAMS.length; TEAMS.forEach((t,i)=>K[t.key]=i);
  if(d.model){ HFA=d.model.hfa; BASE=d.model.base; SCALE=d.model.scale; }
  OFF=TEAMS.map(t=>t.elo); ELO=OFF.slice(); CUR=current(); RES=fromData();
  const c=store.get("custom",null);
  if(c&&typeof c==="object"){ CELO=c; TEAMS.forEach((t,i)=>{ if(Number.isFinite(c[t.key])) ELO[i]=c[t.key]; }); if(ELO.some((v,i)=>v!==OFF[i])){ renderAll(); runCustom(); return; } }
  renderAll();
}).catch(()=>{ $("mlist").innerHTML=`<p class="err">${L().err}</p>`; show("matches"); });
})();
</script>
